name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Setup Cairo toolchain
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.7.0"

      - name: Test the code
        run: scarb test
